services:
  jenkins:
    build:
      context: .
    container_name: shopsphere-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-home:/var/jenkins_home
      - //var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
