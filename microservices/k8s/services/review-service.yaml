apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: shopsphere
  labels:
    app: review-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: review-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: review-service
          image: asj32873/shopsphere-review:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5009
          envFrom:
            - configMapRef:
                name: shopsphere-config
            - secretRef:
                name: shopsphere-secrets
          env:
            - name: PORT
              value: "5009"
          readinessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: shopsphere
spec:
  selector:
    app: review-service
  ports:
    - port: 5009
      targetPort: 5009
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: review-service-pdb
  namespace: shopsphere
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: review-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: review-service-hpa
  namespace: shopsphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: review-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
